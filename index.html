<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXAFI Join Page</title>
  <link rel="stylesheet" href="assets/dashboard.css">
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #0a0a24, #050512);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .connect-btn {
      background: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 26px;
      border-radius: 10px;
      cursor: pointer;
    }
    .connect-btn:hover { background: #0096ff; }
  </style>
</head>

<body>
  <h1>Welcome to HEXAFI</h1>
  <button onclick="connectWallet()" class="connect-btn">Connect Wallet</button>
  <p id="walletAddress"></p>

  <!-- ✅ Load ethers library before script -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>

  <script>
    let provider, signer, userAddress;

    async function connectWallet() {
      if (!window.ethereum) {
        alert("No crypto wallet found. Please open in MetaMask, Trust Wallet or SafePal browser.");
        return;
      }

      try {
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();

        const short = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
        document.getElementById("walletAddress").innerText = "Connected: " + short;
        console.log("✅ Wallet Connected:", userAddress);
      } catch (err) {
        console.error(err);
        alert("Connection failed: " + err.message);
      }
    }
  </script>
</body>
</html>
