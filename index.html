<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEXAFI Join Page</title>
  <link rel="stylesheet" href="assets/dashboard.css">
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #0a0a24, #050512);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo {
      margin-bottom: 20px;
    }
    .logo img {
      width: 160px;
      height: auto;
      border-radius: 12px;
    }
    h1 {
      font-size: 28px;
      color: #00b8ff;
      margin-bottom: 8px;
    }
    p.tagline {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 15px;
    }
    .connect-btn {
      background-color: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 26px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .connect-btn:hover {
      background-color: #0096ff;
      transform: scale(1.05);
    }
    .info {
      margin-top: 20px;
      font-size: 14px;
      color: #ccc;
      word-break: break-all;
    }
    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <!-- 🔹 HEXAFI Logo -->
  <div class="logo">
    <img src="assets/hexafi-logo.png" alt="HEXAFI Logo">
  </div>

  <!-- 🔹 Title -->
  <h1>Welcome to HEXAFI</h1>
  <p class="tagline">Decentralized Smart ROI & Referral System</p>

  <!-- 🔹 Connect Button -->
  <button onclick="connectWallet()" class="connect-btn">Connect Wallet</button>
  <p id="walletAddress" class="info"></p>

  <!-- 🔹 Footer -->
  <footer>Powered by HEXAFI Smart Contract on BSC</footer>

  <!-- 🔹 Ethers.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.min.js"></script>

  <!-- 🔹 Wallet Connect Script -->
  <script>
    let provider;
    let signer;
    let userAddress = "";

    async function connectWallet() {
      try {
        if (window.ethereum == null) {
          alert("No crypto wallet detected. Please install MetaMask or open in Trust Wallet / SafePal browser.");
          return;
        }

        // Request wallet access
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();

        // Show connected address
        const short = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
        document.getElementById("walletAddress").innerText = "Connected: " + short;

        console.log("✅ Wallet Connected:", userAddress);

      } catch (err) {
        console.error(err);
        alert("Connection failed: " + err.message);
      }
    }
  </script>

</body>
</html>
